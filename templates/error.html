{% extends "base.html" %}

{% block title %}Error {{ error_code }} - Campus Placement Analytics System{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-badge">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-description">{{ error_description }}</p>
    <a href="{{ url_for('home') }}" class="btn-primary">&larr; Return to Dashboard</a>
</div>
{% endblock %}
